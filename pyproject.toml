[project]
name = "correlations"
version = "0.1.0a1"
description = "Корреляции и механистические модели режима течения, градиента давления и holdup газожидкостной смеси в трубах"
readme = "README.md"
authors = [
    { name = "Бартенев Владислав" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["multiphase flow", "pressure gradient", "flow pattern", "wellbore", "petroleum engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2",
    "scipy>=1.13",
]

[project.urls]
Repository = "https://github.com/vl1lin/FlowLib"
Issues = "https://github.com/vl1lin/FlowLib/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# В тестах длинные docstring/комментарии со ссылками на ТЗ и формулы — форматтер их не переносит.
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["correlations"]

[tool.pyright]
include = ["src/correlations", "tests"]
# Код библиотеки (core, flow_models, models, registry) — strict.
strict = [
    "src/correlations/core",
    "src/correlations/flow_models",
    "src/correlations/models",
    "src/correlations/registry.py",
]
pythonVersion = "3.11"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
research = [
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
]
